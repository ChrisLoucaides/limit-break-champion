<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- Brand backdrop: dark base, 60px grid, cyan/magenta corner glows -->
    <div class="backdrop">
      <div class="bg_grid"></div>
      <div class="glow glow--cyan"></div>
      <div class="glow glow--magenta"></div>
      <div class="vignette"></div>
    </div>

    <!-- Gradient keyline framing the whole scene -->
    <div class="frame"></div>

    <img class="brand_logo" src="./assets/Logo-Large.png" />

    <!-- Champion character art -->
    <div class="art">
      <div class="art_backglow"></div>
      <div class="champion character"></div>
    </div>

    <!-- Text column -->
    <div class="panel">
      <div class="event_line">
        <span class="event_tick"></span>
        <div class="event_name"></div>
      </div>

      <div class="tournament_name"></div>

      <div class="champion_word">
        <span class="cw_fill">Champion</span>
        <span class="cw_shine" aria-hidden="true">Champion</span>
      </div>

      <div class="title_rule"></div>

      <div class="sponsor_logo"></div>
      <div class="champion_name"></div>
      <div class="real_name"></div>

      <div class="meta">
        <div class="chip character_name"></div>
        <div class="chip pronoun"></div>
        <div class="chip flagcountry"></div>
        <div class="chip flagstate"></div>
        <div class="chip seed"></div>
        <div class="chip twitter"></div>
      </div>
    </div>

    <div class="footer">
      <span class="footer_tick"></span>
      <div class="entrants"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
